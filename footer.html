<!-- Modular Corporate Footer for Midas Cyber Awareness & Security -->
<style>
    .midas-footer-container {
        width: 100%;
        background: linear-gradient(90deg, #030816 0%, #081326 50%, #030919 100%);
        border-radius: 16px;
        border: 1px solid #1e293b;
        padding: 28px 36px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin-top: 40px;
    }

    .footer-main-flex {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
        flex-wrap: wrap;
    }

    /* Left Brand Section */
    .footer-left-brand {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 300px;
    }

    .brand-top-row {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .footer-logo-svg {
        width: 72px;
        height: 72px;
        flex-shrink: 0;
    }

    .brand-title-group {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
    }

    .brand-title-main {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        color: #ffffff;
    }

    .brand-title-sub {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        color: #f59e0b;
        margin-top: 2px;
    }

    .brand-tagline {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.82rem;
        font-weight: 600;
        color: #cbd5e1;
        margin-top: 6px;
    }

    .tagline-line {
        height: 2px;
        width: 24px;
        background-color: #f59e0b;
    }

    .contact-red-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #e11d48;
        color: #ffffff;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 8px 24px;
        border-radius: 6px;
        text-decoration: none;
        width: fit-content;
        transition: background-color 0.2s ease, transform 0.2s ease;
        box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
    }

    .contact-red-btn:hover {
        background-color: #be123c;
        transform: translateY(-1px);
    }

    /* Center SOC Help Card */
    .soc-card {
        background: linear-gradient(135deg, #061329 0%, #0a1b38 100%);
        border: 1px solid #1e3a5f;
        border-radius: 14px;
        padding: 20px 28px;
        display: flex;
        align-items: center;
        gap: 20px;
        position: relative;
        overflow: hidden;
        flex: 1.2;
        min-width: 320px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 8px 20px rgba(0,0,0,0.3);
    }

    .soc-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 30%;
        right: 30%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #f59e0b, transparent);
        box-shadow: 0 0 10px #f59e0b;
    }

    .soc-icon-circle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: #040c1a;
        border: 1px solid #1e3a5f;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .soc-content {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .soc-title {
        font-size: 1.2rem;
        font-weight: 700;
        color: #ffffff;
    }

    .soc-subtext {
        font-size: 0.9rem;
        color: #94a3b8;
    }

    .soc-email-link {
        color: #38bdf8;
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .soc-email-link:hover {
        color: #7dd3fc;
        text-decoration: underline;
    }

    /* Right Action Items */
    .footer-actions-grid {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .action-item-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .action-item-divider {
        width: 1px;
        height: 48px;
        background-color: #1e293b;
    }

    .action-btn-circle {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: #cbd5e1;
        cursor: pointer;
        transition: transform 0.2s ease, color 0.2s ease;
        width: 76px;
        text-align: center;
    }

    .action-btn-circle:hover {
        transform: translateY(-3px);
        color: #ffffff;
    }

    .circle-icon {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 1px solid #334155;
        background: #040c1a;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .action-btn-circle:hover .circle-icon {
        border-color: #f59e0b;
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
    }

    .action-label {
        font-size: 0.8rem;
        font-weight: 600;
        line-height: 1.2;
    }

    @media (max-width: 1024px) {
        .footer-main-flex {
            flex-direction: column;
            align-items: stretch;
        }

        .footer-actions-grid {
            justify-content: space-around;
            flex-wrap: wrap;
        }
    }
</style>

<footer class="midas-footer-container">

        </div>
    </div>
</footer>
